{% load tailwind_cli %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач</title>
    <!-- Тег подключает сгенерированный tailwind.css -->
    {% tailwind_css %}
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">
    <!-- Навигация -->
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Левый блок: логотип и основные разделы -->
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-xl font-bold">Менеджер задач</a>
                    <a href="#" class="text-gray-700 hover:text-gray-900 font-medium">Пользователи</a>
                </div>

                <!-- Правый блок: действия с аккаунтом -->
                <div class="space-x-4">
                    <a href="#" class="text-gray-700 hover:text-gray-900">Вход</a>
                    <a href="#" class="text-gray-700 hover:text-gray-900">Регистрация</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Флеш-сообщения (требование автотестов) -->
    <div role="alert" class="max-w-7xl mx-auto mt-4 px-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm text-blue-800 rounded-lg bg-blue-50" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Основной контент -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
