{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<h1 class="text-4xl font-bold mb-8">{% translate "Изменение метки" %}</h1>

<form method="post" class="max-w-md space-y-5" novalidate>
    {% csrf_token %}

    <div>
        <label for="id_name" class="block text-sm font-medium text-gray-700 mb-1">{% translate "Имя" %}</label>
        <input type="text" name="name" id="id_name" required value="{{ form.name.value|default:form.instance.name }}"
               class="w-full px-3 py-2 border {% if form.name.errors %}border-red-500{% else %}border-gray-400{% endif %} focus:outline-none focus:ring-2 focus:ring-blue-500">
        {% for error in form.name.errors %}
            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
        {% endfor %}
    </div>

    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 cursor-pointer">
        {% translate "Изменить" %}
    </button>
</form>
{% endblock %}
