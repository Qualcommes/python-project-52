{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<h1 class="text-4xl font-bold mb-6">{% translate "Удаление метки" %}</h1>

<p class="mb-6">{% translate "Вы уверены, что хотите удалить" %} {{ object.name }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-6 cursor-pointer">
        {% translate "Да, удалить" %}
    </button>
</form>
{% endblock %}
